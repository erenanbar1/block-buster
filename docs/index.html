<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0C0722">
    <meta name="description" content="A block puzzle game: drag pieces onto the grid, fill rows and columns to clear them.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Block Blast</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0C0722;
        /* The game is a fixed portrait surface; never let the page itself scroll or zoom. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        /* A soft glow behind the play area, matching the game's own backdrop. */
        background:
          radial-gradient(ellipse 70% 50% at 50% 32%, #2A1466 0%, transparent 70%),
          linear-gradient(#140B33, #0C0722);
      }

      #unity-canvas {
        display: block;
        background: #0C0722;
        touch-action: none;
        outline: none;
        border-radius: 6px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
      }

      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        color: #F3EEFF;
        transition: opacity 0.4s ease;
      }
      #loader.hidden { opacity: 0; pointer-events: none; }

      #loader h1 {
        margin: 0;
        font-size: clamp(22px, 5vw, 34px);
        font-weight: 800;
        letter-spacing: 0.32em;
        text-indent: 0.32em;
        color: #F3EEFF;
      }

      #bar {
        width: min(62vw, 300px);
        height: 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.10);
        overflow: hidden;
      }
      #bar > div {
        width: 0%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #A85CFF, #18C7E8);
        transition: width 0.2s ease;
      }

      #hint {
        font-size: 14px;
        letter-spacing: 0.06em;
        color: rgba(243, 238, 255, 0.45);
      }

      #error {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 28px;
        text-align: center;
        color: #FF9F9F;
        font-size: 15px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="unity-canvas" width=1080 height=1920 tabindex="-1"></canvas>
    </div>

    <div id="loader">
      <h1>Block Blast</h1>
      <div id="bar"><div id="bar-fill"></div></div>
      <div id="hint">loading…</div>
    </div>

    <div id="error">
      <strong>This game could not start.</strong>
      <span id="error-text"></span>
    </div>

    <script src="Build/WebGL.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loader = document.querySelector("#loader");
      var barFill = document.querySelector("#bar-fill");

      // The game is designed at 1080x1920. Fit the largest portrait box that the
      // viewport allows, so it looks the same on a phone and on a desktop browser.
      var ASPECT = 1080 / 1920;
      function resize() {
        var vw = window.innerWidth;
        var vh = window.innerHeight;
        var w = vh * ASPECT;
        var h = vh;
        if (w > vw) { w = vw; h = vw / ASPECT; }
        canvas.style.width = Math.floor(w) + "px";
        canvas.style.height = Math.floor(h) + "px";
        // Fullscreen on a phone: no rounded corners or shadow to give away the frame.
        var snug = w >= vw - 1;
        canvas.style.borderRadius = snug ? "0" : "6px";
        canvas.style.boxShadow = snug ? "none" : "0 24px 80px rgba(0,0,0,0.55)";
      }
      resize();
      window.addEventListener("resize", resize);
      window.addEventListener("orientationchange", resize);

      // Block the browser gestures that would otherwise fight with dragging pieces.
      ["gesturestart", "gesturechange", "contextmenu"].forEach(function (evt) {
        window.addEventListener(evt, function (e) { e.preventDefault(); }, { passive: false });
      });
      document.addEventListener("touchmove", function (e) {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/WebGL.data.unityweb",
        frameworkUrl: "Build/WebGL.framework.js.unityweb",
        codeUrl: "Build/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Claude Games",
        productName: "Block Blast",
        productVersion: "1.0",
      }, function (progress) {
        barFill.style.width = (progress * 100) + "%";
      }).then(function () {
        loader.classList.add("hidden");
        setTimeout(function () { loader.style.display = "none"; }, 450);
        resize();
        canvas.focus();
      }).catch(function (message) {
        loader.style.display = "none";
        document.querySelector("#error").style.display = "flex";
        document.querySelector("#error-text").textContent = message;
      });
    </script>
  </body>
</html>
