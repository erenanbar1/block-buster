name: CI

# Tests, builds and deploys the game. Building in CI rather than committing the
# player keeps ~16MB per rebuild out of git history.
#
# Requires one repository secret, UNITY_LICENSE - see README, "Continuous
# integration". Without it every Unity step fails at activation.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.3.12f1

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    # Forked pull requests cannot read secrets, so the Unity licence is absent and
    # activation would fail. Skip rather than report a misleading red run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-test-
            Library-

      - name: EditMode and PlayMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: all
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity test results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results
          retention-days: 14

  build:
    name: WebGL build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-webgl-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-webgl-
            Library-

      # Uses the same entry point as a local build, so CI and a developer machine
      # cannot drift apart. WebGLBuilder applies the Pages-critical settings itself
      # (Gzip plus decompression fallback) and fails loudly when Unity reports
      # success without writing a player.
      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          BUILD_OUTPUT: build/WebGL
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: WebGL
          buildMethod: BlockBlast.EditorTools.WebGLBuilder.Build
          allowDirtyBuild: true

      - name: Check the player was actually written
        run: |
          test -f build/WebGL/index.html || { echo "::error::no index.html in build output"; exit 1; }
          test -d build/WebGL/Build   || { echo "::error::no Build/ directory in build output"; exit 1; }
          echo "Build contents:"; ls -la build/WebGL build/WebGL/Build
          du -sh build/WebGL

      - name: Upload player
        uses: actions/upload-artifact@v4
        with:
          name: webgl-player
          path: build/WebGL
          retention-days: 14

      - name: Package for Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL

  deploy:
    name: Deploy to Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
